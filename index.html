<style>
/* Kümes Haritası — tam ekran uydu haritası; üstte arama, altta araç çubuğu; alttan açılan kartlar */
:root{--bg:#0f1a14;--panel:#16231c;--panel2:#1f3027;--ink:#eef4ef;--muted:#9db1a4;--green:#33c46b;--scan:#2fd36b;--q:#ff9f1c;--cust:#3b82f6;--sale:#22c55e;--bad:#ef4444;--line:#2b3d33;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#map{position:fixed!important;inset:0;width:100vw;height:100vh;height:100dvh;background:#111}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.top{position:fixed;left:0;right:0;top:0;z-index:1000;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;display:flex;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.search{flex:1;display:flex;align-items:center;gap:8px;background:rgba(15,26,20,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:14px;padding:0 12px;height:46px;border:1px solid var(--line)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px}
.rbtn{flex:none;width:46px;height:46px;border-radius:14px;background:rgba(15,26,20,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.results{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:1001;background:var(--panel);border:1px solid var(--line);border-radius:14px;max-height:55vh;overflow:auto;display:none}
.results button{display:block;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.results button small{display:block;color:var(--muted);font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:1000;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:6px;justify-content:center;pointer-events:none}
.bar>div{display:flex;gap:4px;background:rgba(15,26,20,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:5px;pointer-events:auto;max-width:100%;overflow-x:auto}
.tb{flex:none;min-width:58px;height:56px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:0 6px}
.tb b{font-size:21px;line-height:1}
.tb[aria-pressed=true]{background:var(--green);color:#06210f}
.tb:disabled{opacity:.35}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:999;background:rgba(15,26,20,.9);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px;max-width:92vw;text-align:center;display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);z-index:3000;background:#fff;color:#111;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;max-width:92vw;text-align:center}
.sheet{position:fixed;inset:0;z-index:2000;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.panel{position:relative;width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:8px}.ph h3{margin:0;flex:1;font-size:19px}
.x{width:36px;height:36px;border-radius:10px;background:var(--panel2);font-size:18px}
.btn{height:46px;padding:0 14px;border-radius:12px;background:var(--panel2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--green);color:#06210f}.btn.dan{color:#ff8a8a}.btn.full{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1 1 auto}
.field{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;outline:0}
textarea.field{min-height:84px;resize:vertical}
.lbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:-6px}
.muted{color:var(--muted);font-size:13.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:38px;padding:0 12px;border-radius:10px;background:var(--panel2);font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--green);color:#06210f}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.item .g{flex:1;min-width:0}.item small{display:block;color:var(--muted);font-size:12.5px}
.item b.km{white-space:nowrap;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}.kv span{color:var(--muted)}
/* harita işaretleri */
.pin{display:flex;flex-direction:column;align-items:center;transform:translateY(-6px)}
.pin i{width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.6);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:13px;color:#fff}
.pin span{margin-top:2px;background:rgba(0,0,0,.72);color:#fff;font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:6px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.pin.q i{background:var(--q);color:#1b1000}.pin.x i{background:#6b7280}.pin.n i{background:#374151;width:16px;height:16px;border-width:2px}.pin.c i{background:var(--cust)}.pin.s i{background:var(--sale)}.pin.sel i{outline:3px solid #ffe14d}
.bl{transform:translate(-50%,-50%);width:max-content;font:600 12px/1.2 system-ui;color:#fff7c2;text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000;pointer-events:none;letter-spacing:.2px}.bl.i6{font-size:14px;color:#ffd08a}
.poi{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);width:max-content}.poi i{font-style:normal;font-size:15px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}.poi span{margin-top:1px;font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leaflet-control-attribution{font-size:9px;background:rgba(0,0,0,.45)!important;color:#ccc}.leaflet-control-attribution a{color:#ddd}
.leaflet-control-zoom{display:none}
.drawing #map{cursor:crosshair}
.tog{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);z-index:1002;width:64px;height:64px;border-radius:50%;background:rgba(15,26,20,.92);border:2px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:1;color:var(--ink)}.tog small{font-size:10.5px;font-weight:700;margin-top:2px}.tog.on{background:var(--green);color:#06210f;border-color:#06210f}
.send{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:1001;background:#ffe14d;color:#1b1500;border-radius:12px;padding:7px 11px;font-weight:700;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.45);display:none;white-space:nowrap}
body.has-send .hint{bottom:calc(env(safe-area-inset-bottom,0px) + 134px)}
@media (min-width:700px),(hover:hover) and (pointer:fine){
.bar{left:0;right:auto;top:0;bottom:0;padding:10px;flex-direction:column;justify-content:center;align-items:flex-start}
.bar>div{flex-direction:column;max-height:calc(100vh - 20px);overflow-y:auto;overflow-x:hidden}
.tb{width:64px;min-width:64px}
.hint{bottom:16px}
}
.kbar{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);z-index:1002;display:none;gap:8px;align-items:stretch;background:rgba(18,20,24,.92);border:1px solid #333;border-radius:18px;padding:8px;color:#fff;backdrop-filter:blur(8px)}
body.kare .kbar{display:flex}body.kare .bar,body.kare .send,body.kare #tog,body.kare .hint{display:none!important}
.kb{min-width:64px;border:0;border-radius:14px;background:#2a2d33;color:#fff;font:700 18px system-ui}.kb.go{min-width:96px;background:#2f9e44;font-size:17px}
.kmid{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}.kmid b{font-size:16px}.kmid small{opacity:.75;font-size:12px}
.kbtns{display:flex;gap:6px}.kbtns button{border:0;border-radius:10px;background:#2a2d33;color:#fff;font:600 14px system-ui;padding:6px 12px}
@media (min-width:700px),(hover:hover) and (pointer:fine){.kbar{left:50%;right:auto;transform:translateX(-50%);width:min(620px,92vw)}}
/* Kare kare: ekran olabildiğince kareye kalsın, üst arama gizli, alt çubuk ince */
body.kare .top{display:none!important}
body.kare .kbar{padding:4px;gap:6px;border-radius:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 4px);left:4px;right:4px}
body.kare .kb{min-width:44px;font-size:16px;border-radius:10px}body.kare .kb.go{min-width:70px;font-size:15px}
body.kare .kmid{flex-direction:row;justify-content:center;gap:6px;align-items:center}body.kare .kmid small{display:none}body.kare .kmid b{font-size:14px;white-space:nowrap}
body.kare .kbtns{gap:4px}body.kare .kbtns button{padding:5px 9px;font-size:13px}
@media (min-width:700px),(hover:hover) and (pointer:fine){body.kare .kbar{left:50%;right:auto;width:auto;min-width:360px}}
/* Köy merkezindeki müşteriler (mor) */
.vk{display:flex;align-items:center;gap:4px;transform:translate(-50%,-50%);white-space:nowrap;background:#7c3aed;color:#fff;border:2px solid #fff;border-radius:14px;padding:2px 8px;font:700 12px system-ui;box-shadow:0 1px 4px rgba(0,0,0,.5);cursor:pointer}.vk b{font-size:13px}
</style>

<body>
<!-- Şifre kilidi: bu cihazda haritayı açmak için 4 haneli şifre -->
<div id="lock" style="position:fixed;inset:0;z-index:100000;background:#0b0f14;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:system-ui;padding:20px;text-align:center">
<div style="font-size:42px">🔒</div><div id="lkT" style="font:700 20px system-ui">Kümes Haritası</div><div id="lkS" style="opacity:.75;font-size:14px;max-width:320px"></div>
<div id="lkD" style="display:flex;gap:12px;margin:6px 0"></div>
<div id="lkP" style="display:grid;grid-template-columns:repeat(3,72px);gap:10px"></div>
<button id="lkF" style="margin-top:8px;background:none;border:0;color:#8ab4ff;font-size:14px;text-decoration:underline">Şifremi unuttum</button>
</div>
<script>
(function () {
  const K = 'kh-pin', L = document.getElementById('lock');
  const H = async t => { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('kumes|' + t)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { let h = 0; for (const c of 'kumes|' + t) h = (h * 31 + c.charCodeAt(0)) | 0; return 'x' + h; } };
  let pin = '', first = null, setting = false;
  const T = (t, s) => { document.getElementById('lkT').textContent = t; document.getElementById('lkS').textContent = s || ''; };
  const dots = () => { document.getElementById('lkD').innerHTML = [0, 1, 2, 3].map(i => '<span style="width:16px;height:16px;border-radius:50%;border:2px solid #fff;background:' + (i < pin.length ? '#fff' : 'transparent') + '"></span>').join(''); };
  const open = () => { try { sessionStorage.setItem('kh-ok', '1'); } catch (e) {} L.style.display = 'none'; };
  const show = () => { pin = ''; first = null; setting = !localStorage.getItem(K); L.style.display = 'flex'; setting ? T('Şifre belirle', 'Bu cihazda haritayı açmak için 4 haneli bir şifre seç. Her açılışta sorulur.') : T('Kümes Haritası', 'Şifreni gir'); dots(); };
  async function done() {
    if (setting) {
      if (!first) { first = pin; pin = ''; T('Şifreyi tekrar gir', 'Aynı 4 rakamı bir daha gir'); dots(); return; }
      if (first !== pin) { first = null; pin = ''; T('Şifreler aynı değil', 'Baştan 4 haneli bir şifre seç'); dots(); return; }
      localStorage.setItem(K, await H(pin)); open(); return;
    }
    if (await H(pin) === localStorage.getItem(K)) { open(); return; }
    pin = ''; T('Yanlış şifre', 'Tekrar dene'); dots(); if (navigator.vibrate) navigator.vibrate(200);
  }
  const key = d => { if (d === '⌫') { pin = pin.slice(0, -1); dots(); return; } if (pin.length >= 4) return; pin += d; dots(); if (pin.length === 4) setTimeout(done, 120); };
  document.getElementById('lkP').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map(d => d ? '<button data-k="' + d + '" style="height:60px;border-radius:30px;border:0;background:#1f2937;color:#fff;font:600 24px system-ui">' + d + '</button>' : '<span></span>').join('');
  document.getElementById('lkP').onclick = e => { const b = e.target.closest('[data-k]'); if (b) key(b.dataset.k); };
  addEventListener('keydown', e => { if (L.style.display === 'none') return; if (/^\d$/.test(e.key)) key(e.key); else if (e.key === 'Backspace') key('⌫'); });
  document.getElementById('lkF').onclick = () => {
    if (!confirm('Şifreyi sıfırlamak için bu cihazdaki harita bilgileri silinecek (kümesler, yeşil alanlar, müşteri listesi). Sonra haritayı Görev Matrisi’nden açınca hepsi geri gelir; Görev Matrisi’ne gönderilmemiş son değişiklikler kaybolur. Devam edilsin mi?')) return;
    try { Object.keys(localStorage).filter(k => /^kumes|^kh-/.test(k)).forEach(k => localStorage.removeItem(k)); sessionStorage.clear(); } catch (e) {}
    location.replace(location.pathname);
  };
  let hid = 0;
  document.addEventListener('visibilitychange', () => { if (document.hidden) hid = Date.now(); else if (hid && Date.now() - hid > 30 * 60 * 1000) show(); });
  let ok = false; try { ok = sessionStorage.getItem('kh-ok') === '1' && !!localStorage.getItem(K); } catch (e) {}
  if (ok) L.style.display = 'none'; else show();
})();
</script>

<div class="top">
  <label class="search"><span>🔎</span><input id="q" type="search" placeholder="Müşteri ya da köy ara" autocomplete="off"></label>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script src="gshim.js?v=202611240841"></script>
<script>
/* Hata olursa ekranın üstünde kırmızı yazı göster (beyaz ekranda ne olduğunu görebilelim) */
(function () { const show = m => { try { let d = document.getElementById('errbox'); if (!d) { d = document.createElement('div'); d.id = 'errbox'; d.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:#b00020;color:#fff;font:14px/1.4 system-ui;padding:10px 12px;border-radius:10px;white-space:pre-wrap;max-height:40vh;overflow:auto'; d.onclick = () => d.remove(); (document.body || document.documentElement).appendChild(d); } d.textContent = 'HATA (fotoğrafını Claude\'a at): ' + m + '\nsürüm ' + (window.APP_VER_TXT || '?'); } catch (e) {} };
  addEventListener('error', e => show((e.message || 'bilinmeyen') + ' · satır ' + (e.lineno || '?'))); addEventListener('unhandledrejection', e => { const r = String(e.reason && (e.reason.message || e.reason)); if (!/fetch|network|abort|load/i.test(r)) show('söz: ' + r.slice(0, 200)); }); })();
function APP() {
const KEY = 'kumes-harita-v1';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtKm = k => k < 1 ? Math.round(k * 1000) + ' m' : (Math.round(k * 10) / 10).toString().replace('.', ',') + ' km';
const norm = s => String(s || '').toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ı/g, 'i');

/* ---------- Veri ---------- */
// S.areas: taranan alanlar (GeoJSON Polygon/MultiPolygon feature listesi) · S.pins: kümes işaretleri · S.cust: Görev Matrisi'nden gelen müşteri listesi
let S = { v: 1, areas: [], pins: [], cust: [], view: null, layer: 'satlbl', upd: 0 };
try { const r = JSON.parse(localStorage.getItem(KEY) || 'null'); if (r && r.v) S = Object.assign(S, r); } catch (e) {}
// Baştan tarama (23.11.2026): bu tarihten önce boyanmış bütün yeşil alanlar silinir, kümesler kalır. Her cihazda ve Görev Matrisi'nden gelende de geçerli.
const AREA_RESET = 1795448835297;
const areaNew = a => !!(a && a.properties && a.properties.t && a.properties.t >= AREA_RESET);
if (!S.areaReset || S.areaReset < AREA_RESET) { const n = S.areas.length; S.areas.forEach(a => { if (a.properties && a.properties.id) S.del = (S.del || []).concat(a.properties.id).slice(-500); }); S.areas = []; S.kare = null; S.fh = 1; S.areaReset = AREA_RESET; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} if (n) setTimeout(() => { try { toast('Yeşil alanlar temizlendi · kümesler duruyor · baştan taramaya hazır'); } catch (e) {} }, 1500); }
S.areas = S.areas.filter(areaNew);
// Yeşil alan temizliği: kareler arasındaki ince çatlakları/çizgileri kapatır (4 m şişir, 4 m geri daralt), gereksiz köşeleri atar
function areaClean(f) { try { const b = turf.buffer(turf.buffer(f, 0.004, { units: 'kilometers' }), -0.004, { units: 'kilometers' }); if (!b || !b.geometry || turf.area(b) < 50) return f; const s2 = turf.simplify(b, { tolerance: 0.00001 }); s2.properties = f.properties || {}; return s2; } catch (e) { return f; } }

// Köy = kümese EN YAKIN yerleşim (köy merkezi). İlçe/şehir merkezine yakınsa "Merkez".
async function nearestKoy(lat, lng) {
  const q = '[out:json][timeout:20];node(around:8000,' + lat + ',' + lng + ')[place~"^(village|town|city|suburb|neighbourhood|quarter)$"];out body;';
  const j = await (await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q) })).json();
  const P = (j.elements || []).filter(e => e.tags && (e.tags['name:tr'] || e.tags.name)).map(e => ({ n: e.tags['name:tr'] || e.tags.name, t: e.tags.place, d: kmBetween([lat, lng], [e.lat, e.lon]), lat: e.lat, lng: e.lon }));
  if (!P.length) return null;
  const towns = P.filter(x => x.t === 'town' || x.t === 'city');
  P.sort((a, b) => a.d - b.d); const b = P[0];
  if (b.t === 'town' || b.t === 'city') return 'Merkez';
  if (b.t !== 'village' && towns.some(t => kmBetween([b.lat, b.lng], [t.lat, t.lng]) < 4)) return 'Merkez';
  return b.n.replace(/\s+(Mahallesi|Köyü)$/i, '');

}

// Haritada işareti olmayan müşteriler: konumu belliyse orası, değilse köy merkezi (köy başına tek durak)
function custStops() {

    if (c.g) { G['g' + c.i] = { id: 'c:' + c.i, lat: c.g[0], lng: c.g[1], lead: c.i, _v: 1 }; return; }
    if (!c.k || !RT.vn) return; const nk = norm(c.k), v = RT.vn.find(x => x.n === nk); if (!v) return;
