<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kümes Haritası</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kümes Haritası">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1a14">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Kümes Haritası — tam ekran uydu haritası; üstte arama, altta araç çubuğu; alttan açılan kartlar */
:root{--bg:#0f1a14;--panel:#16231c;--panel2:#1f3027;--ink:#eef4ef;--muted:#9db1a4;--green:#33c46b;--scan:#2fd36b;--q:#ff9f1c;--cust:#3b82f6;--sale:#22c55e;--bad:#ef4444;--line:#2b3d33;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#map{position:fixed!important;inset:0;width:100vw;height:100vh;height:100dvh;background:#111}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
.top{position:fixed;left:0;right:0;top:0;z-index:1000;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;display:flex;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.search{flex:1;display:flex;align-items:center;gap:8px;background:rgba(15,26,20,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:14px;padding:0 12px;height:46px;border:1px solid var(--line)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:16px}
.rbtn{flex:none;width:46px;height:46px;border-radius:14px;background:rgba(15,26,20,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.results{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:1001;background:var(--panel);border:1px solid var(--line);border-radius:14px;max-height:55vh;overflow:auto;display:none}
.results button{display:block;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.results button small{display:block;color:var(--muted);font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:1000;padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:6px;justify-content:center;pointer-events:none}
.bar>div{display:flex;gap:4px;background:rgba(15,26,20,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;padding:5px;pointer-events:auto;max-width:100%;overflow-x:auto}
.tb{flex:none;min-width:58px;height:56px;border-radius:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:0 6px}
.tb b{font-size:21px;line-height:1}
.tb[aria-pressed=true]{background:var(--green);color:#06210f}
.tb:disabled{opacity:.35}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:999;background:rgba(15,26,20,.9);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13.5px;max-width:92vw;text-align:center;display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);z-index:3000;background:#fff;color:#111;border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none;max-width:92vw;text-align:center}
.sheet{position:fixed;inset:0;z-index:2000;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.panel{position:relative;width:100%;max-width:560px;max-height:86vh;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:8px}.ph h3{margin:0;flex:1;font-size:19px}
.x{width:36px;height:36px;border-radius:10px;background:var(--panel2);font-size:18px}
.btn{height:46px;padding:0 14px;border-radius:12px;background:var(--panel2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--green);color:#06210f}.btn.dan{color:#ff8a8a}.btn.full{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1 1 auto}
.field{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;outline:0}
textarea.field{min-height:84px;resize:vertical}
.lbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:-6px}
.muted{color:var(--muted);font-size:13.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:38px;padding:0 12px;border-radius:10px;background:var(--panel2);font-weight:600;font-size:14px}
.chip[aria-pressed=true]{background:var(--green);color:#06210f}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.item .g{flex:1;min-width:0}.item small{display:block;color:var(--muted);font-size:12.5px}
.item b.km{white-space:nowrap;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14.5px}.kv span{color:var(--muted)}
/* harita işaretleri */
.pin{display:flex;flex-direction:column;align-items:center;transform:translateY(-6px)}
.pin i{width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.6);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:13px;color:#fff}
.pin span{margin-top:2px;background:rgba(0,0,0,.72);color:#fff;font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:6px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.pin.q i{background:var(--q);color:#1b1000}.pin.x i{background:#6b7280}.pin.n i{background:#374151;width:16px;height:16px;border-width:2px}.pin.c i{background:var(--cust)}.pin.s i{background:var(--sale)}.pin.sel i{outline:3px solid #ffe14d}
.poi{display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);width:max-content}.poi i{font-style:normal;font-size:15px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.5)}.poi span{margin-top:1px;font-size:10.5px;font-weight:700;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leaflet-control-attribution{font-size:9px;background:rgba(0,0,0,.45)!important;color:#ccc}.leaflet-control-attribution a{color:#ddd}
.leaflet-control-zoom{display:none}
.drawing #map{cursor:crosshair}
.tog{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);z-index:1002;width:64px;height:64px;border-radius:50%;background:rgba(15,26,20,.92);border:2px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:1;color:var(--ink)}.tog small{font-size:10.5px;font-weight:700;margin-top:2px}.tog.on{background:var(--green);color:#06210f;border-color:#06210f}
.send{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 82px);z-index:1001;background:#ffe14d;color:#1b1500;border-radius:14px;padding:10px 14px;font-weight:700;font-size:14.5px;box-shadow:0 6px 20px rgba(0,0,0,.45);display:none;white-space:nowrap}
body.has-send .hint{bottom:calc(env(safe-area-inset-bottom,0px) + 134px)}
</style>
</head>
<body>
<div id="map"></div>
<div class="top">
  <label class="search"><span>🔎</span><input id="q" type="search" placeholder="Müşteri ya da köy ara" autocomplete="off"></label>
  <button class="rbtn" id="loc" aria-label="Konumum">📍</button>
  <button class="rbtn" id="menu" aria-label="Menü">☰</button>
</div>
<div class="results" id="res"></div>
<div class="hint" id="hint"></div>
<div class="toast" id="toast"></div>
<button class="send" id="send"></button>
<button class="tog" id="tog" aria-label="Gez / Çiz"><span id="togi">✏️</span><small id="togt">Çiz</small></button>
<div class="bar"><div>
  <button class="tb" data-mode="pan" aria-pressed="true"><b>✋</b>Gez</button>
  <button class="tb" data-mode="draw"><b>✏️</b>Tara</button>
  <button class="tb" data-mode="pin"><b>🏠</b>Kümes</button>
  <button class="tb" data-mode="circle"><b>⭕</b>Daire</button>
  <button class="tb" data-mode="route"><b>🛣️</b>Rota</button>
  <button class="tb" id="undo"><b>↶</b>Geri al</button>
  <button class="tb" id="lay"><b>🗺️</b>Katman</button>
</div></div>
<div class="sheet" id="sheet"><div class="bg" id="sbg"></div><div class="panel" id="panel"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script src="gshim.js?v=202611222103"></script>
<script>
function APP() {
const KEY = 'kumes-harita-v1';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const fmtKm = k => k < 1 ? Math.round(k * 1000) + ' m' : (Math.round(k * 10) / 10).toString().replace('.', ',') + ' km';
const norm = s => String(s || '').toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ı/g, 'i');

/* ---------- Veri ---------- */
// S.areas: taranan alanlar (GeoJSON Polygon/MultiPolygon feature listesi) · S.pins: kümes işaretleri · S.cust: Görev Matrisi'nden gelen müşteri listesi
let S = { v: 1, areas: [], pins: [], cust: [], view: null, layer: 'satlbl', upd: 0 };
try { const r = JSON.parse(localStorage.getItem(KEY) || 'null'); if (r && r.v) S = Object.assign(S, r); } catch (e) {}
if (!S.lv2) { S.layer = 'satlbl'; S.lv2 = 1; }
const hist = [];
const markDel = id => { if (!id) return; S.del = (S.del || []).concat(id).slice(-500); };
function save(snap) { S.upd = Date.now(); sendBadge(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Kaydedilemedi: telefonda yer yok'); } }
function snapshot() { S.chg = (S.chg || 0) + 1; hist.push(JSON.stringify({ areas: S.areas, pins: S.pins })); if (hist.length > 40) hist.shift(); $('undo').disabled = false; }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

/* ---------- Harita ---------- */
const map = L.map('map', { zoomControl: false, attributionControl: true, tap: false, doubleClickZoom: false, maxZoom: 20, worldCopyJump: true }).setView(S.view ? S.view.c : [38.48, 28.14], S.view ? S.view.z : 11);
const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, attribution: 'Uydu: Esri, Maxar, Earthstar' });
const labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19 });
const roads = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 20, maxNativeZoom: 19, opacity: .8 });
const street = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20, maxNativeZoom: 19, attribution: '© OpenStreetMap' });
function applyLayer() {
  if (window.GOOG) { map.g.setMapTypeId(S.layer === 'street' ? 'roadmap' : S.layer === 'sat' ? 'satellite' : 'hybrid'); return; }
  [sat, labels, roads, street].forEach(l => map.hasLayer(l) && map.removeLayer(l));
  if (S.layer === 'street') street.addTo(map); else { sat.addTo(map); if (S.layer === 'satlbl') { roads.addTo(map); labels.addTo(map); } }
}
applyLayer();
map.on('moveend', () => { const c = map.getCenter(); S.view = { c: [+c.lat.toFixed(5), +c.lng.toFixed(5)], z: map.getZoom() }; save(); });

const areaLayer = L.geoJSON(null, { style: { color: '#2fd36b', weight: 2, fillColor: '#2fd36b', fillOpacity: .32 } }).addTo(map);
const pinLayer = L.layerGroup().addTo(map);
const circleLayer = L.layerGroup().addTo(map);
let meMarker = null, selPin = null;

function drawAreas() {
  areaLayer.clearLayers();
  S.areas.forEach((f, i) => { areaLayer.addData(f); });
  // Yeşil alanın içine tıklama: Gez'de alan kartı (içinde 'kümes ekle' var); diğer modlarda haritaya tıklamış gibi; çift tık = kümes ekle
  areaLayer.eachLayer(l => {
    l.on('click', e => { if (mode === 'pan') { L.DomEvent.stopPropagation(e); clearTimeout(clickT); clickT = setTimeout(() => { clickT = null; areaCard(l.feature, e.latlng); }, 260); } else if (window.GOOG && mode !== 'draw') { clearTimeout(clickT); clickT = setTimeout(() => { clickT = null; onClick(e); }, 260); } });
    l.on('dblclick', e => { L.DomEvent.stopPropagation(e); clearTimeout(clickT); clickT = null; newPinAt(e.latlng); });
  });
}
const custById = id => S.cust.find(c => c.i === id);
const PST = { '': '❓ Bilinmiyor', kapali: '🚫 Kümes kapanmış', degil: '✖ Kümes değil' };
const yerTxt = p => [p.k, p.c, p.il].filter(Boolean).join(' / ');
function pinLabel(p) { const c = p.lead && custById(p.lead); return c ? c.n : (p.name || (p.st === 'kapali' ? 'Kapanmış kümes' : p.st === 'degil' ? 'Kümes değil' : 'Bilinmeyen kümes') + (p.k ? ' · ' + p.k : '')); }
function pinCls(p) { const c = p.lead && custById(p.lead); return p.st === 'kapali' ? 'x' : p.st === 'degil' ? 'n' : !p.lead ? 'q' : c && c.s === 'sale' ? 's' : 'c'; }
function drawPins() {
  pinLayer.clearLayers();
  S.pins.forEach(p => {
    const cls = pinCls(p), lbl = pinLabel(p);
    const icon = L.divIcon({ className: '', iconSize: [0, 0], html: '<div class="pin ' + cls + (selPin === p.id ? ' sel' : '') + '"><i>' + (cls === 'q' ? '?' : cls === 'x' ? '✕' : '') + '</i>' + (map.getZoom() >= 14 || selPin === p.id ? '<span>' + esc(lbl) + '</span>' : '') + '</div>' });
    const m = L.marker([p.lat, p.lng], { icon, draggable: !!p._drag, keyboard: false }).addTo(pinLayer);
    m.on('click', e => { L.DomEvent.stopPropagation(e); if (mode === 'circle') { setCircle([p.lat, p.lng], p); return; } if (mode === 'route') { routeTo([p.lat, p.lng], pinLabel(p)); return; } pinCard(p); });
    m.on('dblclick', e => L.DomEvent.stopPropagation(e));
    m.on('dragend', () => { const ll = m.getLatLng(); snapshot(); p.lat = +ll.lat.toFixed(6); p.lng = +ll.lng.toFixed(6); delete p._drag; save(); drawPins(); toast('Yeni yeri kaydedildi'); });
  });
}
map.on('zoomend', drawPins);

/* ---------- Mod ---------- */
let mode = 'pan';
const HINTS = { route: 'Gideceğin yere dokun ya da bir kümese bas. Yol üstündeki kümesler durak olarak listelenir.', draw: (matchMedia('(pointer:fine)').matches ? 'Sol tık basılı: yeşil çiz · Sağ tık basılı: haritayı kaydır · Tekerlek: yakınlaştır · Çift tık: kümes ekle' : 'Tek parmakla çiz, içi yeşile boyanır. İki parmakla kaydır/yakınlaştır. İpucu: Gez’deyken soldaki düğmeyi basılı tutarsan, tuttuğun sürece çizersin.'), pin: 'Kümesin üstüne dokun.', circle: 'Merkeze dokun ya da bir kümese dokun.' };
function setMode(m) {
  mode = m; document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m));
  document.body.classList.toggle('drawing', m === 'draw');
  if (m === 'draw') { map.dragging.disable(); map.touchZoom.disable(); } else { map.dragging.enable(); map.touchZoom.enable(); }
  const tg0 = $('tog'); if (tg0) { tg0.classList.toggle('on', m === 'draw'); $('togi').textContent = m === 'draw' ? '✋' : '✏️'; $('togt').textContent = m === 'draw' ? 'Gez' : 'Çiz'; }
  const h = $('hint'); h.textContent = HINTS[m] || ''; h.style.display = HINTS[m] ? 'block' : 'none';
}
// Gez/Çiz düğmesi: kısa dokun = geçiş · basılı tut = tutarken çiz (bırakınca Gez'e döner) · basıp hemen sürükle = yerini değiştir
(() => {
  const t = $('tog'); let st = null, hold = null, held = false, drag = false, prev = 'pan';
  const place = () => { if (!S.togPos) return; const w = innerWidth, h = innerHeight; t.style.left = Math.min(w - 68, Math.max(4, S.togPos.x * w)) + 'px'; t.style.top = Math.min(h - 68, Math.max(4, S.togPos.y * h)) + 'px'; t.style.bottom = 'auto'; };
  place(); addEventListener('resize', place);
  t.style.touchAction = 'none';
  t.addEventListener('contextmenu', ev => ev.preventDefault());
  t.addEventListener('pointerdown', ev => {
    ev.preventDefault(); st = { x: ev.clientX, y: ev.clientY, r: t.getBoundingClientRect(), id: ev.pointerId }; drag = false; held = false; try { t.setPointerCapture(ev.pointerId); } catch (e) {}
    hold = setTimeout(() => { hold = null; if (drag) return; held = true; prev = mode; if (mode !== 'draw') setMode('draw'); t.style.transform = 'scale(1.12)'; try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} }, 260);
  });
  t.addEventListener('pointermove', ev => {
    if (!st || ev.pointerId !== st.id || held) return; const dx = ev.clientX - st.x, dy = ev.clientY - st.y;
    if (!drag) { if (!hold || Math.hypot(dx, dy) < 12) return; clearTimeout(hold); hold = null; drag = true; t.style.opacity = '.8'; }
    t.style.left = Math.min(innerWidth - 68, Math.max(4, st.r.left + dx)) + 'px'; t.style.top = Math.min(innerHeight - 68, Math.max(4, st.r.top + dy)) + 'px'; t.style.bottom = 'auto';
  });
  const up = ev => {
    if (!st || ev.pointerId !== st.id) return; if (hold) { clearTimeout(hold); hold = null; }
    t.style.transform = ''; t.style.opacity = '';
    if (drag) { S.togPos = { x: parseFloat(t.style.left) / innerWidth, y: parseFloat(t.style.top) / innerHeight }; save(); }
    else if (held) { if (prev !== 'draw') setMode(prev); }
    else setMode(mode === 'draw' ? 'pan' : 'draw');
    st = null; drag = false; held = false;
  };
  t.addEventListener('pointerup', up); t.addEventListener('pointercancel', up);
})();
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode === mode && mode !== 'pan' ? 'pan' : b.dataset.mode));

/* ---------- Kalemle tarama ---------- */
let path = null, tmp = null, drawId = null;
const mapEl = $('map');
function ptLL(ev) { const r = mapEl.getBoundingClientRect(); return map.containerPointToLatLng([ev.clientX - r.left, ev.clientY - r.top]); }
let rpan = null;
mapEl.addEventListener('contextmenu', ev => ev.preventDefault(), true);
// Tara modunda: tek parmak çizer, iki parmak haritayı kaydırır ve yakınlaştırır
const touches = new Map(); let tg = null, touchLock = false;
const tMid = () => { const a = [...touches.values()]; return { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2, d: Math.max(10, Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y)) }; };
mapEl.addEventListener('pointerdown', ev => {
  if (mode !== 'draw' || ev.pointerType !== 'touch') return;
  touches.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
  if (touches.size >= 2) { ev.preventDefault(); ev.stopImmediatePropagation(); if (path) { path = null; if (tmp) map.removeLayer(tmp); tmp = null; } touchLock = true; const m = tMid(); tg = { x: m.x, y: m.y, d: m.d, z: map.getZoom() }; }
  else if (touchLock) ev.stopImmediatePropagation();
}, { passive: false, capture: true });
mapEl.addEventListener('pointermove', ev => {
  if (!touches.has(ev.pointerId)) return; touches.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });

  $('m-list').onclick = () => { const L2 = S.pins.filter(p => !p.lead); open('<div class="ph"><h3>❓ Bilinmeyen kümesler</h3><button class="x" data-close>✕</button></div><div class="list">' + (L2.length ? L2.slice().sort((a, b) => yerTxt(a).localeCompare(yerTxt(b), 'tr')).map(p => '<button class="item" data-go="' + p.id + '"><div class="g"><b>' + esc(pinLabel(p)) + '</b><small>' + esc([p.st ? PST[p.st] : '', yerTxt(p), p.note].filter(Boolean).join(' · ')) + '</small></div>›</button>').join('') : '<div class="muted">Yok.</div>') + '</div>'); document.querySelectorAll('#panel [data-go]').forEach(b => b.onclick = () => { const z = S.pins.find(x => x.id === b.dataset.go); close(); map.setView([z.lat, z.lng], 17); setTimeout(() => pinCard(z), 300); }); };
  $('m-help').onclick = help;
  $('m-key').onclick = () => { let cur = ''; try { cur = localStorage.getItem('kh-gkey') || ''; } catch (e) {}
    open('<div class="ph"><h3>🔑 Google harita anahtarı</h3><button class="x" data-close>✕</button></div><div class="muted">Google Cloud’dan aldığın AIza… ile başlayan anahtarı yapıştır. Boş bırakıp kaydedersen eski haritaya döner.</div><input class="field" id="gk" value="' + esc(cur) + '" placeholder="AIza…" autocomplete="off"><button class="btn pri full" id="gkok">Kaydet ve yeniden aç</button>');
    $('gkok').onclick = () => { const v = $('gk').value.trim(); try { if (v) localStorage.setItem('kh-gkey', v); else localStorage.setItem('kh-gkey', ''); sessionStorage.removeItem('kh-gfail'); } catch (e) {} location.reload(); }; };
  $('m-wipe').onclick = () => { if (!S.areas.length) return; snapshot(); S.areas.forEach(a => markDel(a.properties && a.properties.id)); S.areas = []; save(); drawAreas(); close(); toast('Silindi · Geri al ile geri getirebilirsin'); };
};
function pasteIn() {
  open('<div class="ph"><h3>Görev Matrisi’nden al</h3><button class="x" data-close>✕</button></div>' +
    '<div class="muted">Görev Matrisi → Müşteri → 🛰️ Uydu haritası → “Müşterileri kopyala”ya bas, sonra buraya yapıştır.</div>' +
    '<button class="btn full" id="pc-clip">📋 Panodan yapıştır</button><textarea class="field" id="pc-t" placeholder="ya da buraya basılı tutup Yapıştır"></textarea><button class="btn full pri" id="pc-ok">Al</button>');
  $('pc-clip').onclick = async () => { try { $('pc-t').value = await navigator.clipboard.readText(); } catch (e) { toast('Kutuya basılı tutup Yapıştır de'); } };
  $('pc-ok').onclick = () => {
    let o; try { o = JSON.parse($('pc-t').value.trim()); } catch (e) { return toast('Bu yazı anlaşılamadı'); }
    importPayload(o);
  };
}
// Görev Matrisi'nden gelen müşteri listesi + harita yedeği (yapıştırma ya da bağlantıyla)
function importPayload(o) {
    if (!o || !Array.isArray(o.cust)) return toast('Müşteri listesi bulunamadı');
    S.cust = o.cust; let added = 0, restored = false;
    // Başka cihazda yapılanları birleştir: eksik işaretler eklenir, aynı işaretin yenisi kalır; yeşil alanlar üst üste birleşir
    if (o.full) {
      const dl = new Set(o.full.del || []); if (dl.size) { S.pins = S.pins.filter(p => !dl.has(p.id)); S.areas = S.areas.filter(a => !dl.has(a.properties && a.properties.id)); S.del = [...new Set((S.del || []).concat([...dl]))].slice(-500); }
      const ownP = {}; S.pins.forEach(p => ownP[p.id] = p);
      (o.full.pins || []).forEach(p => { if (dl.has(p.id)) return; const m = ownP[p.id]; if (!m) { S.pins.push(p); restored = true; } else if ((p.upd || p.t || 0) > (m.upd || m.t || 0)) { Object.assign(m, p); restored = true; } });
      const ownA = new Set(S.areas.map(a => a.properties && a.properties.id).filter(Boolean)), key = a => JSON.stringify(a.geometry);
      const ownG = new Set(S.areas.map(key));
      (o.full.areas || []).forEach(a => { if ((a.properties && dl.has(a.properties.id)) || (a.properties && ownA.has(a.properties.id)) || ownG.has(key(a))) return; try { const t = a.properties && a.properties.t, n = a.properties && a.properties.note; addArea({ geometry: a.geometry }); markDel(a.properties && a.properties.id); const last = S.areas[S.areas.length - 1]; if (t) last.properties.t = Math.min(last.properties.t, t); if (n && !last.properties.note) last.properties.note = n; restored = true; } catch (e) {} });
    }
    let linked = 0;
    S.cust.forEach(c => { if (!c.mp) return; const pin = S.pins.find(p => p.id === c.mp); if (pin && !pin.lead && !/^❓ /.test(c.n)) { pin.lead = c.i; linked++; } });
    S.cust.forEach(c => { if (c.g && !c.mp && !S.pins.some(p => p.lead === c.i)) { S.pins.push({ id: uid(), lat: c.g[0], lng: c.g[1], lead: c.i, name: '', note: '', cnt: '', t: Date.now() }); added++; } });
    save(); drawPins(); drawAreas(); close();
    toast(S.cust.length + ' müşteri alındı' + (added ? ' · ' + added + ' konum haritaya eklendi' : '') + (linked ? ' · ' + linked + ' bilinmeyen kümesin sahibi işlendi' : '') + (restored ? ' · diğer cihazdaki çizim ve işaretler eklendi' : ''));
}
function help() {
  open('<div class="ph"><h3>Nasıl kullanılır</h3><button class="x" data-close>✕</button></div><div class="list" style="gap:10px;font-size:15px">' +
    '<div>✋ <b>Gez</b>: haritayı kaydır, iki parmakla yakınlaştır. Herhangi bir yere dokunursan köy adı ve yol tarifi çıkar.</div>' +
    '<div>✏️ <b>Tara</b>: baktığın yerin etrafını parmağınla çiz, içi yeşil olur. Eski bir alana değecek şekilde çizersen ona eklenir. Yeşil alana dokunursan (Gez’de) not yazar ya da silersin.</div>' +
    '<div>🖱️ <b>Bilgisayarda</b>: Tara’dayken sol tık basılı yeşil çizer, sağ tık basılı haritayı kaydırır, tekerlek yakınlaştırır. Her yerde çift tık = kümes ekle.</div>' +
    '<div>🏠 <b>Kümes</b>: çift dokun ya da Kümes’e basıp çatıya dokun, müşteriyi seç. Bilmiyorsan seçmeden kaydet, ❓ olur ve köyü kendiliğinden yazılır. Sonra açıp “Kümes kapanmış” ya da “Kümes değil” seçebilirsin. İşarete dokununca kartı açılır: telefon, düzenle, taşı, yol tarifi.</div>' +
    '<div>⭕ <b>Daire</b>: bir kümese ya da herhangi bir yere dokun; 1–30 km arası daire çizilir, içindeki kümesler yakından uzağa km’siyle listelenir.</div>' +
    '<div>🛣️ <b>Rota</b>: gideceğin yere dokun. Yolun iki yanındaki ❓ kümesler (ya da müşteriler) durak olarak listelenir; işaretle, “Google Maps’te aç” de, duraklarıyla açılır.</div>' +
    '<div>↶ <b>Geri al</b>: son çizimi, eklemeyi ya da silmeyi geri alır.</div>' +
    '<div>🔎 <b>Arama</b>: müşteri adı yaz, işaretliyse kümesine, değilse köyüne gider.</div>' +
    '<div>☰ <b>Menü</b>: Görev Matrisi’ne gönder / Görev Matrisi’nden al. Gönder dedikçe bütün harita Görev Matrisi’nde yedeklenir.</div></div>');
}

async function sendOut() {
    const rnd = (k, v) => typeof v === 'number' && !Number.isInteger(v) && Math.abs(v) < 200 ? Math.round(v * 1e5) / 1e5 : v;
    const out = JSON.stringify({ kh: 1, at: Date.now(), geo: S.pins.filter(p => p.lead).map(p => [p.lead, p.lat, p.lng]), full: { areas: S.areas.map(a => { try { return turf.truncate(a, { precision: 5 }); } catch (e) { return a; } }), pins: S.pins.map(p => { const o = Object.assign({}, p); delete o._drag; return o; }), del: S.del || [] } }, rnd);
    try { await navigator.clipboard.writeText(out); S.chg = 0; save(); close(); open('<div class="ph"><h3>✓ Kopyalandı</h3><button class="x" data-close>✕</button></div><div class="list" style="gap:8px;font-size:15px"><div>1. Görev Matrisi’ni aç</div><div>2. Müşteri → 🛰️ Uydu haritası</div><div>3. “Haritadan al” kutusuna basılı tut → <b>Yapıştır</b></div></div><div class="muted">Yapıştırınca kendiliğinden alır.</div>'); } catch (e) { open('<div class="ph"><h3>Kopyala</h3><button class="x" data-close>✕</button></div><div class="muted">Otomatik kopyalanamadı. Kutuya basılı tut → Tümünü Seç → Kopyala.</div><textarea class="field" style="min-height:200px">' + esc(out) + '</textarea>'); S.chg = 0; save(); }
}
function sendBadge() { const n = S.chg || 0, b = $('send'); if (!b) return; b.style.display = n ? 'block' : 'none'; document.body.classList.toggle('has-send', !!n); b.textContent = '⬆️ ' + n + ' değişiklik aktarılmadı · Aktar'; }
$('send').onclick = sendOut;
window.addEventListener('beforeunload', e => { if (S.chg) { e.preventDefault(); e.returnValue = ''; } });
/* ---------- Alttan açılan kart ---------- */
function open(html) { $('panel').innerHTML = html; $('sheet').classList.add('on'); $('panel').scrollTop = 0; $('panel').querySelectorAll('[data-close]').forEach(b => b.onclick = close); }
function close() { if (dropM) { map.removeLayer(dropM); dropM = null; } $('sheet').classList.remove('on'); $('panel').innerHTML = ''; if (selPin) { selPin = null; drawPins(); } }
$('sbg').onclick = close;
let tt = null; function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(tt); tt = setTimeout(() => t.style.display = 'none', 2600); }

/* ---------- Görev Matrisi'nden gelen bağlantı: #ll=38.1,28.2 ya da #m=müşteriId ---------- */
let rtDone = false;
async function routeFromParam() {
  if (rtDone) return; rtDone = true;
  const rt = new URLSearchParams(location.search).get('rt'); if (!rt) return;
  const [k, c, il] = rt.split('|'); toast((k || c) + ' için rota hazırlanıyor…');
  let x = null; try { const a = await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=tr&accept-language=tr&q=' + encodeURIComponent([k, c, il].filter(Boolean).join(', ')))).json(); x = a[0]; } catch (e) {}
  if (!x) { try { const a = await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=tr&q=' + encodeURIComponent([c, il].filter(Boolean).join(', ')))).json(); x = a[0]; } catch (e) {} }
  if (!x) return toast('Köyün yeri bulunamadı');
  setMode('route'); RT.only = 'all'; routeTo([+x.lat, +x.lon], (k || c) + (k ? ' köyü' : ''));
}
async function fromHash() {
  const raw = location.hash.slice(1);
  if (raw.startsWith('gz=')) {
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    try {
      const b = raw.slice(3).replace(/-/g, '+').replace(/_/g, '/'), bin = atob(b), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const txt = await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
      importPayload(JSON.parse(txt));
    } catch (e) { toast('Görev Matrisi bilgileri okunamadı'); }
    routeFromParam(); return;
  }
  routeFromParam();
  const h = decodeURIComponent(raw); if (!h) return;
  const m = h.match(/^ll=(-?[\d.]+),(-?[\d.]+)/); if (m) { map.setView([+m[1], +m[2]], 17); return; }
  const c = h.match(/^m=(.+)$/); if (c) setTimeout(() => goCust(c[1]), 400);
}
window.addEventListener('hashchange', fromHash);

if (!S.fh && S.areas.length) { const old0 = S.areas; try { const old = S.areas, before = JSON.stringify(old.map(x => x.geometry)); S.areas = []; old.forEach(x => addArea(x)); if (JSON.stringify(S.areas.map(x => x.geometry)) !== before) S.chg = (S.chg || 0) + 1; } catch (e) { S.areas = old0; } S.fh = 1; save(); }
drawAreas(); drawPins(); fromHash(); sendBadge();
if (window.GOOG_ERR) setTimeout(() => toast(window.GOOG_ERR), 800);
setTimeout(fixOldKoy, 2500);
if (S.chg) setTimeout(() => toast('Geçen sefer aktarılmamış ' + S.chg + ' değişiklik var · sarı Aktar düğmesine bas'), 900);
if (!S.cust.length && !S.pins.length && !/gz=|rt=/.test(location.href)) setTimeout(() => { if (!S.cust.length && !S.pins.length && !$('sheet').classList.contains('on')) help(); }, 600);
}
/* Güncelleme: sunucudaki sürüm bu sayfadan yeniyse sayfayı yeni sürümle yeniden aç (ana ekran simgesi eski sürümde takılmasın) */
const APP_VER = '202611222103';
function checkUpdate() { fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(t => { t = (t || '').trim(); if (t && t > APP_VER) { const u = new URL(location.href); u.searchParams.set('v', t); location.replace(u.toString()); } }).catch(() => {}); }
checkUpdate(); document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
/* Açılış: Google anahtarı varsa Google Haritalar, yoksa eski (Esri) harita */
const GKEY_DEFAULT = 'AIzaSyCE3zuULF8IlW7TOx-aB9wNoN5xwCLyKQE';
(function boot() {
  let k = GKEY_DEFAULT; try { const it = localStorage.getItem('kh-gkey'); if (it !== null) k = it; } catch (e) {}
  try { if (sessionStorage.getItem('kh-gfail')) { k = ''; window.GOOG_ERR = 'Google haritası açılamadı (anahtar henüz hazır değil), eski harita açıldı'; } } catch (e) {}
  window.GOOG = false;
  if (!k) { APP(); return; }
  let started = false; const go = goog => { if (started) return; started = true; window.GOOG = goog; if (goog) installShim(); APP(); };
  window.gmReady = () => go(true);
  window.gm_authFailure = () => { try { sessionStorage.setItem('kh-gfail', '1'); } catch (e) {} location.reload(); };
  const sc = document.createElement('script'); sc.async = true;
  sc.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(k) + '&callback=gmReady&language=tr&region=TR&v=weekly&loading=async';
  sc.onerror = () => { window.GOOG_ERR = 'Google haritası yüklenemedi, eski harita açıldı'; go(false); };
  document.head.appendChild(sc);
  setTimeout(() => { if (!started) { window.GOOG_ERR = 'Google haritası geç kaldı, eski harita açıldı'; go(false); } }, 12000);
})();
