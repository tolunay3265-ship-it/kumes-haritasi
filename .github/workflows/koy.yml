name: koy
on:
  push:
    paths: ['tools/koy.py', '.github/workflows/koy.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/koy.py
      - run: |
          git config user.name koy-bot
          git config user.email koy-bot@users.noreply.github.com
          git add koy.json
          git commit -m "koy.json güncellendi" || exit 0
          git push
